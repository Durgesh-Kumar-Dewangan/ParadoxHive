# Render Blueprint: static site deploy for ParadoxHive
services:
  - type: web
    name: paradoxhive
    runtime: static
    buildCommand: echo "No build step needed"
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
